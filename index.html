<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kamrej house in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --scene:#e6eaec; --ground:#d3cfc6;
  --ink:#1c2830; --ink-2:#5a6770; --panel:rgba(252,252,250,.9); --panel-solid:#fcfcfa;
  --line:#d4d9dc; --accent:#d18e0c; --hover:#edf0f1;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --scene:#161b20; --ground:#272c31;
    --ink:#e3e8eb; --ink-2:#9aa7b0; --panel:rgba(27,33,39,.9); --panel-solid:#1b2127;
    --line:#35404a; --accent:#e6a93c; --hover:#252d35;
  }
}
:root[data-theme="dark"]{
  --scene:#161b20; --ground:#272c31;
  --ink:#e3e8eb; --ink-2:#9aa7b0; --panel:rgba(27,33,39,.9); --panel-solid:#1b2127;
  --line:#35404a; --accent:#e6a93c; --hover:#252d35;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--scene);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}

.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 18px) 20px 0;pointer-events:none}
.top>*{pointer-events:auto}
h1{margin:0;font-size:24px;line-height:1.1;font-weight:700;font-stretch:82%;letter-spacing:-.005em}
.title p{margin:5px 0 0;font-size:13.5px;line-height:1.45;color:var(--ink-2);max-width:36ch}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btn{font:inherit;font-size:13px;font-weight:520;color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn[aria-pressed="false"]{color:var(--ink-2)}
.btn[aria-pressed]::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px;
  border:1.5px solid var(--ink-2)}
.btn[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}
.btn:hover{background:var(--panel-solid)}

.floors{position:fixed;left:50%;bottom:0;transform:translateX(-50%);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);max-width:calc(100% - 24px)}
.seg{display:flex;gap:2px;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:13px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 8px 28px rgba(18,28,38,.14)}
.seg button{font:inherit;font-size:14px;font-weight:560;border:0;background:transparent;color:var(--ink-2);
  padding:9px 15px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--panel-solid)}

.rooms{position:fixed;right:20px;top:calc(env(safe-area-inset-top,0px) + 74px);width:262px;max-height:calc(100% - 200px);overflow:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:15px 8px 12px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.rooms h2{margin:0 8px 3px;font-size:16px;font-weight:680;font-stretch:88%}
.rooms .sum{margin:0 8px 10px;font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.rooms ul{list-style:none;margin:0;padding:0}
.rooms li button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;
  padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;line-height:1.3}
.rooms li button .d{color:var(--ink-2);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rooms li button.stack{display:block}
.rooms li button.stack .d{display:block;white-space:normal;margin-top:2px}
.rooms li button:hover,.rooms li button.hl{background:var(--hover)}
.rooms li button.hl{box-shadow:inset 3px 0 0 var(--accent)}
.rooms .note{margin:10px 8px 0;padding-top:10px;border-top:1px solid var(--line);font-size:11.5px;line-height:1.5;color:var(--ink-2)}

.label{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;white-space:nowrap;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 7px 4px;
  font:560 12px/1.2 "Archivo",system-ui,sans-serif;color:var(--ink);will-change:transform}
.label small{display:block;font-weight:420;font-size:10.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.label.hl{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}

.hint{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 26px);margin:0;font-size:12px;color:var(--ink-2);max-width:30ch;line-height:1.45;transition:opacity .4s}
.hint.gone{opacity:0}
.msg{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:var(--ink-2);padding:24px;text-align:center}
.msg[hidden]{display:none}

.btn:focus-visible,.seg button:focus-visible,.rooms li button:focus-visible,.label:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:900px){.rooms{display:none}.hint{display:none}}
@media (max-width:560px){
  .top{padding:calc(env(safe-area-inset-top,0px) + 14px) 14px 0;flex-direction:column;gap:10px}
  h1{font-size:20px}
  .title p{font-size:12.5px;max-width:34ch}
  .tools{justify-content:flex-start}
  .btn{font-size:12.5px;padding:6px 11px}
  .seg button{font-size:13px;padding:8px 10px}
  .label{font-size:11px;padding:2px 6px 3px}
  .label small{display:none}
}
@media (prefers-reduced-motion: reduce){.hint{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive 3D model of the house. Drag to rotate, scroll to zoom."></canvas>
<div id="labels"></div>

<header class="top">
  <div class="title">
    <h1>Kamrej house</h1>
    <p>Built from the OP-2 floor plan: a 20′ × 41′-6″ plot with a ground floor and two floors above.</p>
  </div>
  <div class="tools">
    <button class="btn" id="tFurn" aria-pressed="true">Furniture</button>
    <button class="btn" id="tLabels" aria-pressed="true">Room names</button>
    <button class="btn" id="tReset">Reset view</button>
  </div>
</header>

<aside class="rooms" id="rooms" aria-live="polite"></aside>

<nav class="floors" aria-label="Choose a floor">
  <div class="seg" role="tablist" id="seg">
    <button role="tab" data-f="all" aria-selected="true">Whole house</button>
    <button role="tab" data-f="G" aria-selected="false">Ground</button>
    <button role="tab" data-f="F1" aria-selected="false">First</button>
    <button role="tab" data-f="F2" aria-selected="false">Second</button>
  </div>
</nav>

<p class="hint" id="hint">Drag to rotate, scroll or pinch to zoom, right-drag or two fingers to pan.</p>
<div class="msg" id="msg">Building the model…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
"use strict";
const msg = document.getElementById('msg');
if (!window.THREE || !THREE.OrbitControls) {
  msg.textContent = "The 3D library didn't load. Check your connection and reload the page.";
  return;
}
const T = THREE;

/* ---------- renderer, scene, camera ---------- */
const canvas = document.getElementById('c');
const renderer = new T.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.localClippingEnabled = true;
/* one horizontal section plane: everything above it is cut away in floor views */
const CLIP = [new T.Plane(new T.Vector3(0, -1, 0), 1e4)];
function poche(sh) { sh.fragmentShader = sh.fragmentShader.replace('#include <dithering_fragment>', '#include <dithering_fragment>\n\tif (!gl_FrontFacing) gl_FragColor = vec4(0.27, 0.29, 0.32, 1.0);'); }

const scene = new T.Scene();
const camera = new T.PerspectiveCamera(38, 1, 0.5, 900);
const controls = new T.OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 8;
controls.maxDistance = 220;
controls.screenSpacePanning = true;

scene.add(new T.HemisphereLight(0xf2f5f8, 0x9c9384, 0.62));
scene.add(new T.AmbientLight(0xffffff, 0.06));
const sun = new T.DirectionalLight(0xfff5e8, 0.74);
sun.position.set(-24, 72, 66);
sun.target.position.set(10, 8, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 10, far: 220 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);

/* ---------- helpers ---------- */
function M(hex, o) {
  o = Object.assign({}, o || {}); const keep = o.noClip; delete o.noClip;

}
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shade(hex, amt) {

function tex(draw, seed) {

}
function speckle(g, R, n, rgb, a) { for (let i = 0; i < n; i++) { g.fillStyle = 'rgba(' + rgb + ',' + (R() * a).toFixed(3) + ')'; g.fillRect(R() * 256, R() * 256, 1 + R() * 2, 1 + R() * 2); } }
function grid(g, n, base, grout, R, vary) {
  g.fillStyle = grout; g.fillRect(0, 0, 256, 256);
  const s = 256 / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { g.fillStyle = shade(base, (R() - .5) * vary); g.fillRect(i * s + 1.5, j * s + 1.5, s - 3, s - 3); }
}
function planks(g, R, base, joint, n) {
  const h = 256 / n;
  for (let j = 0; j < n; j++) {
    let x = -R() * 200;
    while (x < 256) {

      for (const off of [0, 256]) { g.fillStyle = col; g.fillRect(x - off, j * h, len, h); }
      g.fillStyle = joint; g.fillRect(x, j * h, 1.5, h);
      x += len;
    }
    g.fillStyle = joint; g.fillRect(0, j * h, 256, 1.5);
    for (let k = 0; k < 6; k++) { g.fillStyle = 'rgba(70,45,25,' + (R() * .08).toFixed(3) + ')'; g.fillRect(0, j * h + R() * h, 256, 1); }
  }
}
const TEX = {
  vit:     { s: 2, r: .45, t: tex((g, R) => { g.fillStyle = '#e5ded1'; g.fillRect(0, 0, 256, 256); speckle(g, R, 1200, '120,100,80', .06); g.fillStyle = '#cfc6b6'; g.fillRect(0, 0, 256, 2); g.fillRect(0, 0, 2, 256); }, 1) },
  tile:    { s: 2, r: .4,  t: tex((g, R) => grid(g, 2, '#c9cfd2', '#a9b0b4', R, .05), 2) },
  wood:    { s: 2, r: .62, t: tex((g, R) => planks(g, R, '#b68c62', 'rgba(60,40,22,.45)', 4), 3) },
  kota:    { s: 2, r: .8,  t: tex((g, R) => { g.fillStyle = '#8f988c'; g.fillRect(0, 0, 256, 256); for (let i = 0; i < 60; i++) { g.fillStyle = 'rgba(' + (R() > .5 ? '60,70,60' : '170,180,165') + ',' + (R() * .12).toFixed(3) + ')'; g.beginPath(); g.arc(R() * 256, R() * 256, 6 + R() * 30, 0, 7); g.fill(); } g.fillStyle = '#6f776c'; g.fillRect(0, 0, 256, 2); g.fillRect(0, 0, 2, 256); }, 4) },
  marble:  { s: 2, r: .3,  t: tex((g, R) => { g.fillStyle = '#f2f0ea'; g.fillRect(0, 0, 256, 256); g.strokeStyle = 'rgba(150,150,160,.22)'; for (let i = 0; i < 5; i++) { g.lineWidth = .6 + R() * 1.4; g.beginPath(); g.moveTo(R() * 256, 0); g.bezierCurveTo(R() * 256, 90, R() * 256, 170, R() * 256, 256); g.stroke(); } g.fillStyle = '#dcd8cf'; g.fillRect(0, 0, 256, 1.5); g.fillRect(0, 0, 1.5, 256); }, 5) },
  terrace: { s: 2, r: .85, t: tex((g, R) => grid(g, 2, '#c49c7d', '#ddd2c4', R, .08), 6) },
  tileOut: { s: 2, r: .7,  t: tex((g, R) => grid(g, 2, '#bdb7ad', '#a39d93', R, .05), 7) },
  carpet:  { s: 4, r: 1,   t: tex((g, R) => { g.fillStyle = '#3a414c'; g.fillRect(0, 0, 256, 256); speckle(g, R, 3000, '255,255,255', .05); }, 8) },
  duct:    { s: 2, r: 1,   t: tex((g) => { g.fillStyle = '#4c5155'; g.fillRect(0, 0, 256, 256); }, 9) },
  deck:    { s: 2, r: .7,  t: tex((g, R) => planks(g, R, '#8c6646', 'rgba(30,18,10,.6)', 5), 10) },
};
function floorMat(kind, w, d) {
  const k = TEX[kind]; const t = k.t.clone(); t.needsUpdate = true; t.repeat.set(w / k.s, d / k.s);
  return M(0xffffff, { map: t, roughness: k.r });
}

const mat = {
  plaster: M(0xede9e2), slab: M(0xf5f3ef), plinth: M(0xb2ab9f), stone: M(0x585e64, { roughness: .72 }),
  stair: M(0xd9d3c8, { roughness: .6 }), rail: M(0x34383d, { roughness: .45, metalness: .5 }),
  glass: M(0xa8d0e2, { transparent: true, opacity: .28, roughness: .05, metalness: .2, depthWrite: false }),
  frame: M(0x383c41, { roughness: .5, metalness: .4 }), doorFrame: M(0x6b472e, { roughness: .6 }), door: M(0x7c5134, { roughness: .55 }),
  linen: M(0xe6e1d8), white: M(0xf7f7f4, { roughness: .35 }), blanketA: M(0x6f8796), blanketB: M(0x9a7a62),
  bedFrame: M(0x5f4330, { roughness: .6 }), headboard: M(0x8f7a66), wood: M(0x9b7350, { roughness: .6 }), woodDark: M(0x5b4130, { roughness: .6 }),
  cabinet: M(0xd8d1c5, { roughness: .6 }), cabinetDark: M(0x4a3b31, { roughness: .6 }), groove: M(0x7d7468),
  granite: M(0x2e3033, { roughness: .35 }), steel: M(0xbcc1c6, { roughness: .35, metalness: .6 }), black: M(0x1c1e21, { roughness: .4 }),
  screen: M(0x12161b, { roughness: .2, emissive: 0x16283a, emissiveIntensity: .6 }),
  sofa: M(0x8a8f86), cushion: M(0xb7aa95), leather: M(0x6a2e33, { roughness: .55 }), leatherTop: M(0x7c3a3f, { roughness: .55 }),
  chair: M(0x9a8e83), rug: M(0xc6b49a, { roughness: 1 }), rug2: M(0x8e9aa0, { roughness: 1 }),
  water: M(0x9fd2df, { roughness: .1, metalness: .1 }),
  plant: M(0x557f45, { flatShading: true, noClip: true }), plant2: M(0x77a056, { flatShading: true, noClip: true }), plant3: M(0x3f6b3c, { flatShading: true, noClip: true }), trunkTree: M(0x6b4a33, { noClip: true }),
  pot: M(0xa8643f), soil: M(0x5a4636), trunk: M(0x6b4a33),
  rafter: M(0x8a3a22, { roughness: .55, metalness: .3, noClip: true }), slat: M(0xc47f45, { roughness: .7, noClip: true }), post: M(0x7b4a2a, { roughness: .6, noClip: true }),
  outdoor: M(0xcfc6b4), road: M(0x55595e, { roughness: .95, noClip: true }), path: M(0xbab5ab, { noClip: true }),
  glow: new T.MeshBasicMaterial({ color: 0xffb43c, clippingPlanes: CLIP }), marigold: M(0xe39a1c, { roughness: .5 }),
};
const groundMat = M(0xd3cfc6, { roughness: 1, noClip: true });
const edgeMat = new T.LineBasicMaterial({ color: 0x7f878d, transparent: true, opacity: .32, clippingPlanes: CLIP });

const UNIT = new T.BoxGeometry(1, 1, 1);
const UNIT_E = new T.EdgesGeometry(UNIT);
const YUP = new T.Vector3(0, 1, 0);

function B(p, x0, z0, x1, z1, y0, y1, m, o) {
  const w = Math.abs(x1 - x0), d = Math.abs(z1 - z0), h = y1 - y0;
  if (w < 1e-3 || d < 1e-3 || h < 1e-3) return null;
  const ms = new T.Mesh(UNIT, m);
  ms.scale.set(w, h, d);
  ms.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  ms.castShadow = !(o && o.noCast) && !m.transparent;
  ms.receiveShadow = !m.transparent;
  p.add(ms);
  if (o && o.edges) { const e = new T.LineSegments(UNIT_E, edgeMat); e.scale.copy(ms.scale); e.position.copy(ms.position); p.add(e); }
  return ms;
}
function grp(p, x, y, z, ry) { const g = new T.Group(); g.position.set(x, y, z); g.rotation.y = ry || 0; p.add(g); return g; }
function bar(p, a, b, t, m) {
  const va = new T.Vector3(a[0], a[1], a[2]), vb = new T.Vector3(b[0], b[1], b[2]);
  const d = vb.clone().sub(va), L = d.length();
  const ms = new T.Mesh(UNIT, m); ms.scale.set(t, L, t);
  ms.position.copy(va).add(vb).multiplyScalar(.5);
  ms.quaternion.setFromUnitVectors(YUP, d.normalize());
  ms.castShadow = true; p.add(ms); return ms;
}
function cyl(p, x, z, y0, h, r, m, seg) {
  const ms = new T.Mesh(new T.CylinderGeometry(r, r, h, seg || 24), m);
  ms.position.set(x, y0 + h / 2, z); ms.castShadow = true; ms.receiveShadow = true; p.add(ms); return ms;
}
function blob(p, x, y, z, r, m) {
  const ms = new T.Mesh(new T.IcosahedronGeometry(r, 1), m);
  ms.position.set(x, y, z); ms.castShadow = true; p.add(ms); return ms;
}
function extr(p, shape, top, th, m, edges) {
  const g = new T.ExtrudeGeometry(shape, { depth: th, bevelEnabled: false });
  g.rotateX(Math.PI / 2);
  const ms = new T.Mesh(g, m); ms.position.y = top; ms.castShadow = true; ms.receiveShadow = true; p.add(ms);
  if (edges) { const e = new T.LineSegments(new T.EdgesGeometry(g, 20), edgeMat); e.position.y = top; p.add(e); }
  return ms;
}
function rectShape(x0, z0, x1, z1) { const s = new T.Shape(); s.moveTo(x0, z0); s.lineTo(x1, z0); s.lineTo(x1, z1); s.lineTo(x0, z1); s.closePath(); return s; }
function slab(p, r, holes, top, th) {
  const s = rectShape(r[0], r[1], r[2], r[3]);
  for (const h of holes) { const ph = new T.Path(); ph.moveTo(h[0], h[1]); ph.lineTo(h[0], h[3]); ph.lineTo(h[2], h[3]); ph.lineTo(h[2], h[1]); ph.closePath(); s.holes.push(ph); }
  return extr(p, s, top, th, mat.slab, true);
}

/* Walls run along their long axis; openings are [start, end, type] measured on that axis. */
const OPS = {
  door: { sill: 0, head: 7, frame: true },
  win: { sill: 3, head: 7, glass: true },
  vent: { sill: 5.5, head: 7, glass: true },
  glassdoor: { sill: 0, head: 7.5, glass: true },
  rail: { sill: 3, head: 8.5, glass: true, thin: true },
};
function W(p, x0, z0, x1, z1, o) {
  const m = o.mat || mat.plaster, ffl = o.ffl, bot = o.bot !== undefined ? o.bot : ffl, top = o.top;
  const ax = (x1 - x0) >= (z1 - z0);

function buildRooms() {
  const holder = document.getElementById('labels');
  for (const rm of ROOMS) {
    const y = rm.y !== undefined ? rm.y : LV[rm.f];
    rm.level = y + (rm.lift || 0);
    const grpS = F[rm.f].s;
    rm.hl = [];
    rm.hlMat = new T.MeshBasicMaterial({ color: 0xe0a02a, transparent: true, opacity: .42, depthWrite: false, clippingPlanes: CLIP });
    for (const r of rm.r) {
      if (rm.fin) B(grpS, r[0], r[1], r[2], r[3], y, y + .04, floorMat(rm.fin, r[2] - r[0], r[3] - r[1]), { noCast: true });
      const h = B(grpS, r[0] + .05, r[1] + .05, r[2] - .05, r[3] - .05, rm.level + .07, rm.level + .1, rm.hlMat, { noCast: true });
      h.visible = false; h.renderOrder = 2; rm.hl.push(h);
    }
    const r0 = rm.r[0];
    rm.c = rm.at || [(r0[0] + r0[2]) / 2, (r0[1] + r0[3]) / 2];
    if (!rm.hide) {
      const el = document.createElement('div');
      el.className = 'label'; el.tabIndex = -1; el.style.display = 'none';
      el.innerHTML = '<span></span>' + (rm.d ? '<small></small>' : '');
      el.firstChild.textContent = rm.n; if (rm.d) el.lastChild.textContent = rm.d;
      el.addEventListener('pointerenter', () => hl(rm, true));
      el.addEventListener('pointerleave', () => hl(rm, false));
      el.addEventListener('click', () => focusRoom(rm));
      holder.appendChild(el); rm.el = el;
    }
  }
}

/* ---------- interaction ---------- */
let cur = 'all', labelsOn = true, tween = null;
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function hl(rm, on) {
  rm.hl.forEach(m => { m.visible = on; });
  if (rm.el) rm.el.classList.toggle('hl', on);
  if (rm.btn) rm.btn.classList.toggle('hl', on);
}
function fitScale() { const a = camera.aspect; return a < 1.25 ? Math.min(1.55, 1.15 / a) : 1; }
function flyTo(pos, tgt) {
  const p1 = new T.Vector3(pos[0], pos[1], pos[2]), t1 = new T.Vector3(tgt[0], tgt[1], tgt[2]);
  if (reduced) { camera.position.copy(p1); controls.target.copy(t1); tween = null; return; }
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1, t1, start: performance.now(), ms: 950 };
}
function view(id) {
  const k = fitScale();
  const side = window.innerWidth > 900 ? 4.5 : 0;
  if (id === 'all') { const t = [10 + side, 13, 21]; return [[t[0] - 37 * k, t[1] + 30 * k, t[2] + 76 * k], t]; }
  const y = LV[id], t = [10 + side, y, 23];
  return [[t[0] - 9 * k, y + 67 * k, t[2] + 33 * k], t];
}
function focusRoom(rm) {
  const k = Math.min(fitScale(), 1.6), t = [rm.c[0], rm.level + 1, rm.c[1]];
  flyTo([t[0] - 9 * k, t[1] + 24 * k, t[2] + 17 * k], t);
}
function setFloor(id, keepCam) {
  cur = id;
  const order = ['G', 'F1', 'F2', 'R'], lim = id === 'all' ? 3 : order.indexOf(id);
  order.forEach((k, i) => { F[k].root.visible = i <= lim; });
  CLIP[0].constant = id === 'all' ? 1e4 : LV[id] + 6.8;
  document.querySelectorAll('#seg button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.f === id)));
  for (const rm of ROOMS) { hl(rm, false); if (rm.el) rm.el.style.display = (labelsOn && rm.f === id) ? '' : 'none'; }
  renderPanel();
  if (!keepCam) { const v = view(id); flyTo(v[0], v[1]); }
}
function renderPanel() {
  const el = document.getElementById('rooms'); el.innerHTML = '';
  const h = document.createElement('h2'), p = document.createElement('p'), ul = document.createElement('ul');
  p.className = 'sum';
  if (cur === 'all') {
    h.textContent = 'Whole house';
    p.textContent = 'Pick a floor to take the floors above it off and look inside.';
    for (const id of ['G', 'F1', 'F2']) {
      const li = document.createElement('li'), b = document.createElement('button');
      b.className = 'stack';
      b.innerHTML = '<span></span><span class="d"></span>';
      b.firstChild.textContent = FLOORS[id].name; b.lastChild.textContent = FLOORS[id].sum;
      b.addEventListener('click', () => setFloor(id));
      li.appendChild(b); ul.appendChild(li);
    }
  } else {
    h.textContent = FLOORS[cur].name; p.textContent = FLOORS[cur].sum;
    for (const rm of ROOMS) {
      if (rm.f !== cur || rm.hide) continue;
      const li = document.createElement('li'), b = document.createElement('button');
      b.innerHTML = '<span></span><span class="d"></span>';
      b.firstChild.textContent = rm.n; b.lastChild.textContent = rm.d || '';
      b.addEventListener('mouseenter', () => hl(rm, true));
      b.addEventListener('mouseleave', () => hl(rm, false));
      b.addEventListener('focus', () => hl(rm, true));
      b.addEventListener('blur', () => hl(rm, false));
      b.addEventListener('click', () => focusRoom(rm));
      rm.btn = b; li.appendChild(b); ul.appendChild(li);
    }
  }
  const n = document.createElement('p'); n.className = 'note';
  n.textContent = cur === 'F1' || cur === 'F2'
    ? 'The 6′-11½″ × 9′-4″ box beside the lobby is shown as a cut-out over the dining table with a skylight on the roof. Heights aren’t on the drawing, so floors are 10′ apart.'
    : 'Room sizes and wall positions come from your drawing. Heights aren’t on it, so floors are 10′ apart, doors 7′ high and terrace parapets 3′-6″. Windows are placed on the front and back walls only.';
  el.append(h, p, ul, n);
}

document.getElementById('seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setFloor(b.dataset.f); });
document.getElementById('seg').addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const btns = [...document.querySelectorAll('#seg button')], i = btns.findIndex(b => b.dataset.f === cur);
  const nb = btns[(i + (e.key === 'ArrowRight' ? 1 : btns.length - 1)) % btns.length]; nb.focus(); setFloor(nb.dataset.f);
});
const tFurn = document.getElementById('tFurn'), tLabels = document.getElementById('tLabels');
tFurn.addEventListener('click', () => { const on = tFurn.getAttribute('aria-pressed') !== 'true'; tFurn.setAttribute('aria-pressed', String(on)); for (const k in F) F[k].f.visible = on; });
tLabels.addEventListener('click', () => { labelsOn = tLabels.getAttribute('aria-pressed') !== 'true'; tLabels.setAttribute('aria-pressed', String(labelsOn)); setFloor(cur, true); });
document.getElementById('tReset').addEventListener('click', () => { const v = view(cur); flyTo(v[0], v[1]); });
const hint = document.getElementById('hint');
controls.addEventListener('start', () => { tween = null; hint.classList.add('gone'); });

/* ---------- theme ---------- */
function applyTheme() {
  const cs = getComputedStyle(document.documentElement);
  const bg = new T.Color(cs.getPropertyValue('--scene').trim() || '#e6eaec');
  scene.background = bg;
  scene.fog = new T.Fog(bg, 170, 420);
  groundMat.color.set(cs.getPropertyValue('--ground').trim() || '#d3cfc6');
}
const mq = window.matchMedia('(prefers-color-scheme: dark)');
if (mq.addEventListener) mq.addEventListener('change', applyTheme); else if (mq.addListener) mq.addListener(applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

/* ---------- loop ---------- */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
const v3 = new T.Vector3();
function updateLabels() {
  if (!labelsOn || cur === 'all') return;
  const w = window.innerWidth, h = window.innerHeight;
  for (const rm of ROOMS) {
    if (!rm.el || rm.f !== cur) continue;
    v3.set(rm.c[0], rm.level + .3, rm.c[1]).project(camera);
    if (v3.z > 1) { rm.el.style.visibility = 'hidden'; continue; }
    rm.el.style.visibility = '';
    rm.el.style.transform = 'translate(' + ((v3.x * .5 + .5) * w).toFixed(1) + 'px,' + ((-v3.y * .5 + .5) * h).toFixed(1) + 'px) translate(-50%,-50%)';
  }
}
function loop(now) {
  if (tween) {
    let k = (now - tween.start) / tween.ms; if (k >= 1) k = 1;
    const e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e);
    if (k === 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
  updateLabels();
  requestAnimationFrame(loop);
}

try {
  applyTheme(); buildSite(); buildG(); buildF1(); buildF2(); buildRoof(); buildRooms(); resize();
  const v = view('all'); camera.position.set(v[0][0], v[0][1], v[0][2]); controls.target.set(v[1][0], v[1][1], v[1][2]);
  setFloor('all', true);
  msg.hidden = true;
  requestAnimationFrame(loop);
} catch (err) {
  msg.textContent = 'The model hit an error while building: ' + err.message;
  console.error(err);
}
})();
